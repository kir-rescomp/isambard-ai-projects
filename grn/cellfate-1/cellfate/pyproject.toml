[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellfate"
version = "0.1.0"
description = "GPU-native weighted-ensemble stochastic simulation of gene regulatory networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "pyyaml>=6.0"]

[project.optional-dependencies]
io = ["pyarrow>=14"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
cellfate = "cellfate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cellfate"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs, about a minute each on CPU"]
